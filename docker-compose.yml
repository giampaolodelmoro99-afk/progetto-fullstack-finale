name: ecommerce

services:
  app:
    build:
      context: .
      dockerfile: docker/php/Dockerfile
      args:
        UID: ${UID:-1000}
        GID: ${GID:-1000}
    image: ecommerce-app
    volumes:
      - ./backend:/var/www/html
    ports:
      - "${APP_PORT:-8000}:8000"
    depends_on:
      mysql:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8000/api/v1/health"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 300s

  mysql:
    image: mysql:8.4
    environment:
      MYSQL_DATABASE: ecommerce
      MYSQL_USER: ecommerce
      MYSQL_PASSWORD: secret
      MYSQL_ROOT_PASSWORD: root
    volumes:
      - mysql-data:/var/lib/mysql
      - ./docker/mysql/init:/docker-entrypoint-initdb.d:ro
    ports:
      - "${MYSQL_HOST_PORT:-3307}:3306"
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -P 3306 -u root -p\"$$MYSQL_ROOT_PASSWORD\" --silent"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 60s

  node:
    image: node:24-bookworm-slim
    user: "${UID:-1000}:${GID:-1000}"
    working_dir: /app
    entrypoint: ["sh", "/usr/local/bin/node-entrypoint.sh"]
    environment:
      VITE_USE_POLLING: ${VITE_USE_POLLING:-false}
      npm_config_cache: /tmp/.npm
    volumes:
      - ./frontend:/app
      - ./docker/node/entrypoint.sh:/usr/local/bin/node-entrypoint.sh:ro
    ports:
      - "${VITE_PORT:-5173}:5173"

  mailpit:
    image: axllent/mailpit
    ports:
      - "${MAILPIT_UI_PORT:-8025}:8025"
      - "${MAILPIT_SMTP_PORT:-1025}:1025"

  # AI assistant, only with the "ai" profile (docker compose --profile ai up):
  # a plain docker compose up downloads nothing of Ollama and the shop runs
  # with the assistant unavailable. Internal only: the Ollama API has no
  # authentication, so its port is not published on the host. app reaches it
  # at ollama:11434 and does not depend on it.
  ollama:
    image: ollama/ollama:0.35.0
    profiles: ["ai"]
    entrypoint: ["sh", "/opt/ollama/entrypoint.sh"]
    environment:
      ASSISTANT_MODEL: casa-del-silicio
      OLLAMA_KEEP_ALIVE: ${OLLAMA_KEEP_ALIVE:-30m}
      OLLAMA_NUM_PARALLEL: 1
    volumes:
      - ollama-data:/root/.ollama
      - ./docker/ollama:/opt/ollama:ro
    # Healthy only once the shop model exists; the first download can take
    # several minutes, hence the long start period.
    healthcheck:
      test: ["CMD-SHELL", "ollama show \"$$ASSISTANT_MODEL\" >/dev/null"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 900s

  phpmyadmin:
    image: phpmyadmin
    environment:
      PMA_HOST: mysql
      PMA_PORT: 3306
    ports:
      - "${PMA_PORT:-8081}:80"
    depends_on:
      mysql:
        condition: service_healthy

volumes:
  mysql-data:
  ollama-data:
