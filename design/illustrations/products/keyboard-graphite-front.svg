<svg xmlns="http://www.w3.org/2000/svg" width="800" height="1000" viewBox="0 0 800 1000">
  <title>Keyboard, top view, graphite finish</title>
  <defs>
    <linearGradient id="ink" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#3A3834"/>
      <stop offset="1" stop-color="#1C1B19"/>
    </linearGradient>
    <pattern id="keys" x="160" y="512" width="40" height="38" patternUnits="userSpaceOnUse">
      <rect x="3" y="3" width="34" height="32" rx="6" fill="#3A3834"/>
    </pattern>
    <filter id="blur" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="14"/>
    </filter>
  </defs>
  <rect width="800" height="1000" fill="#F0EBE1"/>
  <ellipse cx="400" cy="700" rx="290" ry="16" fill="#1C1B19" opacity="0.16" filter="url(#blur)"/>
  <rect x="140" y="496" width="520" height="190" rx="20" fill="url(#ink)"/>
  <rect x="160" y="512" width="480" height="114" fill="url(#keys)"/>
  <rect x="163" y="629" width="74" height="32" rx="6" fill="#3A3834"/>
  <rect x="243" y="629" width="74" height="32" rx="6" fill="#3A3834"/>
  <rect x="323" y="629" width="234" height="32" rx="6" fill="#3A3834"/>
  <rect x="563" y="629" width="74" height="32" rx="6" fill="#3A3834"/>
  <rect x="163" y="515" width="34" height="32" rx="6" fill="#B89560"/>
</svg>
