<svg xmlns="http://www.w3.org/2000/svg" width="800" height="1000" viewBox="0 0 800 1000">
  <title>Speaker, top ring detail, ivory finish</title>
  <defs>
    <linearGradient id="gold" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#CDB27E"/>
      <stop offset="1" stop-color="#B89560"/>
    </linearGradient>
    <filter id="blur" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="20"/>
    </filter>
  </defs>
  <rect width="800" height="1000" fill="#F0EBE1"/>
  <circle cx="414" cy="520" r="262" fill="#1C1B19" opacity="0.18" filter="url(#blur)"/>
  <circle cx="400" cy="500" r="260" fill="#FAF7F0"/>
  <circle cx="400" cy="500" r="236" fill="url(#gold)"/>
  <circle cx="400" cy="500" r="196" fill="#CDB27E"/>
  <circle cx="400" cy="500" r="150" fill="none" stroke="#B89560" stroke-width="2"/>
  <circle cx="400" cy="500" r="22" fill="#A29D94"/>
</svg>
