<svg xmlns="http://www.w3.org/2000/svg" width="800" height="1000" viewBox="0 0 800 1000">
  <title>Earbud, speaker mesh detail, ivory finish</title>
  <defs>
    <linearGradient id="ivory" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#FFFFFF"/>
      <stop offset="1" stop-color="#E4DDCF"/>
    </linearGradient>
    <pattern id="grille" width="14" height="14" patternUnits="userSpaceOnUse">
      <circle cx="7" cy="7" r="2.5" fill="#A29D94"/>
    </pattern>
    <filter id="blur" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="18"/>
    </filter>
  </defs>
  <rect width="800" height="1000" fill="#F0EBE1"/>
  <ellipse cx="410" cy="870" rx="150" ry="20" fill="#1C1B19" opacity="0.16" filter="url(#blur)"/>
  <rect x="345" y="470" width="110" height="390" rx="55" fill="url(#ivory)"/>
  <rect x="345" y="770" width="110" height="16" fill="#B89560"/>
  <circle cx="400" cy="380" r="180" fill="url(#ivory)"/>
  <circle cx="400" cy="380" r="78" fill="none" stroke="#B89560" stroke-width="12"/>
  <circle cx="400" cy="380" r="58" fill="#E4DDCF"/>
  <circle cx="400" cy="380" r="58" fill="url(#grille)"/>
</svg>
