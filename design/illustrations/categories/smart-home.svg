<svg xmlns="http://www.w3.org/2000/svg" width="800" height="1000" viewBox="0 0 800 1000">
  <title>Smart home category: table lamp and sensor</title>
  <defs>
    <linearGradient id="ink" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#3A3834"/>
      <stop offset="1" stop-color="#1C1B19"/>
    </linearGradient>
    <linearGradient id="shade" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFFFFF"/>
      <stop offset="1" stop-color="#E4DDCF"/>
    </linearGradient>
    <filter id="blur" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="14"/>
    </filter>
  </defs>
  <rect width="800" height="1000" fill="#F0EBE1"/>
  <g transform="translate(-70 0)">
    <ellipse cx="400" cy="746" rx="110" ry="14" fill="#1C1B19" opacity="0.16" filter="url(#blur)"/>
    <rect x="393" y="525" width="14" height="206" fill="#1C1B19"/>
    <ellipse cx="400" cy="735" rx="78" ry="13" fill="#1C1B19"/>
    <circle cx="440" cy="731" r="4" fill="#B89560"/>
    <path d="M285 520 A115 115 0 0 1 515 520 Z" fill="url(#shade)"/>
    <rect x="280" y="516" width="240" height="9" rx="4" fill="#B89560"/>
  </g>
  <g transform="translate(250 200) scale(0.7)">
    <ellipse cx="400" cy="690" rx="130" ry="14" fill="#1C1B19" opacity="0.16" filter="url(#blur)"/>
    <rect x="300" y="460" width="200" height="220" rx="64" fill="url(#ink)"/>
    <circle cx="400" cy="552" r="42" fill="none" stroke="#B89560" stroke-width="6"/>
    <circle cx="400" cy="552" r="6" fill="#B89560"/>
    <rect x="360" y="626" width="80" height="5" rx="2.5" fill="#5E5A53"/>
    <rect x="360" y="638" width="80" height="5" rx="2.5" fill="#5E5A53"/>
    <rect x="360" y="650" width="80" height="5" rx="2.5" fill="#5E5A53"/>
  </g>
</svg>
