<svg xmlns="http://www.w3.org/2000/svg" width="800" height="1000" viewBox="0 0 800 1000">
  <title>Audio category: headphones and speaker</title>
  <defs>
    <linearGradient id="ink" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#3A3834"/>
      <stop offset="1" stop-color="#1C1B19"/>
    </linearGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#CDB27E"/>
      <stop offset="1" stop-color="#B89560"/>
    </linearGradient>
    <pattern id="grille" width="16" height="16" patternUnits="userSpaceOnUse">
      <circle cx="8" cy="8" r="2" fill="#5E5A53"/>
    </pattern>
    <filter id="blur" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="14"/>
    </filter>
  </defs>
  <rect width="800" height="1000" fill="#F0EBE1"/>
  <g transform="translate(0 70) scale(0.8)">
    <ellipse cx="400" cy="770" rx="200" ry="16" fill="#1C1B19" opacity="0.16" filter="url(#blur)"/>
    <path d="M250 570 V440 A150 150 0 0 1 550 440 V570" fill="none" stroke="#1C1B19" stroke-width="34" stroke-linecap="round"/>
    <path d="M278 560 V446 A122 122 0 0 1 522 446 V560" fill="none" stroke="#B89560" stroke-width="5"/>
    <rect x="237" y="540" width="26" height="46" rx="4" fill="#5E5A53"/>
    <rect x="537" y="540" width="26" height="46" rx="4" fill="#5E5A53"/>
    <rect x="180" y="580" width="130" height="185" rx="52" fill="url(#ink)"/>
    <rect x="490" y="580" width="130" height="185" rx="52" fill="url(#ink)"/>
    <rect x="296" y="600" width="30" height="146" rx="15" fill="#5E5A53"/>
    <rect x="474" y="600" width="30" height="146" rx="15" fill="#5E5A53"/>
    <circle cx="242" cy="672" r="32" fill="none" stroke="#B89560" stroke-width="6"/>
    <circle cx="558" cy="672" r="32" fill="none" stroke="#B89560" stroke-width="6"/>
  </g>
  <g transform="translate(360 260) scale(0.62)">
    <ellipse cx="400" cy="768" rx="140" ry="16" fill="#1C1B19" opacity="0.16" filter="url(#blur)"/>
    <path d="M300 350 H500 V680 Q500 760 420 760 H380 Q300 760 300 680 Z" fill="url(#ink)"/>
    <rect x="324" y="392" width="152" height="340" rx="50" fill="url(#grille)"/>
    <rect x="286" y="318" width="228" height="62" rx="31" fill="url(#gold)"/>
    <rect x="302" y="332" width="196" height="34" rx="17" fill="#CDB27E"/>
    <circle cx="400" cy="349" r="7" fill="#5E5A53"/>
  </g>
