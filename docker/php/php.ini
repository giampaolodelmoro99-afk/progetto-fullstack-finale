memory_limit = 768M
upload_max_filesize = 10M
post_max_size = 64M
date.timezone = Europe/Rome

; Errors go to the container log, never into a response: a body above
; post_max_size must reach Laravel, which answers 413 in JSON.
display_errors = Off
display_startup_errors = Off
log_errors = On
error_log = /dev/stderr

opcache.enable_cli = 0

pcov.enabled = 1
pcov.directory = /var/www/html/app
